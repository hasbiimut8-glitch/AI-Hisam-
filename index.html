<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisam AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030712;
            --card: rgba(15, 23, 42, 0.85);
            --elevated: rgba(20, 30, 50, 0.95);
            --fg: #e2e8f0;
            --muted: #64748b;
            --accent: #06b6d4;
            --glow: rgba(6, 182, 212, 0.18);
            --border: rgba(148, 163, 184, 0.1);
            --err: #ef4444;
            --ok: #10b981;
            --warn: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; line-height: 1.6; }

        .bg {
            position: fixed; inset: 0; z-index: -10;
            background: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(6,182,212,0.07) 0%, transparent 60%),
                         radial-gradient(ellipse 50% 40% at 100% 100%, rgba(139,92,246,0.05) 0%, transparent 50%), var(--bg);
        }
        .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(6,182,212,0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.022) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(ellipse 70% 55% at 50% 28%, black 25%, transparent 70%); }
        .orb { position: absolute; border-radius: 50%; filter: blur(110px); animation: drift 26s ease-in-out infinite; pointer-events: none; }
        .orb1 { width: 420px; height: 420px; background: rgba(6,182,212,0.09); top: -160px; left: -100px; }
        .orb2 { width: 360px; height: 360px; background: rgba(139,92,246,0.06); bottom: -100px; right: -80px; animation-delay: -13s; }
        @keyframes drift { 0%,100%{transform:translate(0)} 50%{transform:translate(28px,-18px)} }

        .app { display: flex; height: 100vh; }

        /* Sidebar */
        .side {
            width: 260px; background: var(--card); backdrop-filter: blur(22px);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            transition: transform 0.35s cubic-bezier(.16,1,.3,1); z-index: 60;
        }
        .side-head { padding: 18px 15px; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
        .brand-icon {
            width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), #0891b2);
            border-radius: 11px; display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px;
            color: var(--bg); box-shadow: 0 4px 20px var(--glow);
        }
        .brand h1 { font-size: 1.15rem; font-weight: 700; }
        .brand span { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .btn-new {
            width: 100%; padding: 11px 15px; background: linear-gradient(135deg, var(--accent), #0891b2);
            border: none; border-radius: 9px; color: var(--bg); font-weight: 600; font-size: 0.82rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: all 0.2s; font-family: inherit;
        }
        .btn-new:hover { transform: translateY(-2px); box-shadow: 0 7px 24px var(--glow); }
        .side-body { flex: 1; overflow-y: auto; padding: 11px; }
        .sec-lbl { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); padding: 6px 9px; font-weight: 600; }
        .hist-item {
            padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: all 0.18s;
            font-size: 0.81rem; color: var(--muted); display: flex; align-items: center; gap: 7px; margin-bottom: 2px;
        }
        .hist-item:hover { background: rgba(6,182,212,0.06); color: var(--fg); }
        .hist-item svg { width: 13px; height: 13px; opacity: 0.38; flex-shrink: 0; }
        .side-foot { padding: 11px 15px; border-top: 1px solid var(--border); }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .hdr {
            height: 56px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border); background: rgba(3,7,18,0.72); backdrop-filter: blur(14px);
            position: sticky; top: 0; z-index: 50;
        }
        .menu-btn {
            width: 35px; height: 35px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--card); color: var(--muted); cursor: pointer; display: none;
            align-items: center; justify-content: center; transition: all 0.18s;
        }
        .menu-btn:hover { border-color: var(--accent); color: var(--accent); }
        .status-pill {
            display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px;
            background: rgba(16,185,129,0.09); border: 1px solid rgba(16,185,129,0.17); border-radius: 100px;
            font-size: 0.71rem; color: var(--ok); font-weight: 500;
        }
        .status-dot { width: 6px; height: 6px; background: var(--ok); border-radius: 50%; animation: blink 2s infinite; }
        @keyframes blink { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.5)} 50%{box-shadow:0 0 0 4px rgba(16,185,129,0)} }

        /* Chat */
        .chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .msgs { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 18px; }
        .msgs::-webkit-scrollbar { width: 4px; }
        .msgs::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

        /* Welcome */
        .welcome { max-width: 720px; margin: 0 auto; padding: 36px 14px; text-align: center; }
        .welcome-badge {
            display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
            background: rgba(6,182,212,0.07); border: 1px solid rgba(6,182,212,0.12); border-radius: 100px;
            font-size: 0.72rem; color: var(--accent); margin-bottom: 18px; font-weight: 500;
        }
        .welcome h2 {
            font-size: clamp(1.6rem, 3.8vw, 2.4rem); font-weight: 800; line-height: 1.1;
            letter-spacing: -0.02em; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--fg), var(--accent), #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome p { font-size: 0.93rem; color: var(--muted); max-width: 400px; margin: 0 auto 30px; line-height: 1.58; }
        .grid-feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 11px; text-align: left; }
        .feat {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; cursor: pointer; transition: all 0.28s cubic-bezier(.16,1,.3,1);
        }
        .feat:hover { transform: translateY(-4px); border-color: rgba(6,182,212,0.3); box-shadow: 0 10px 32px rgba(0,0,0,0.32), 0 0 0 1px var(--glow); }
        .feat-icon {
            width: 36px; height: 36px; background: linear-gradient(135deg, rgba(6,182,212,0.12), rgba(139,92,246,0.07));
            border-radius: 9px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px; color: var(--accent);
        }
        .feat-title { font-weight: 600; font-size: 0.86rem; margin-bottom: 2px; }
        .feat-desc { font-size: 0.76rem; color: var(--muted); line-height: 1.38; }

        /* Messages */
        .msg-list { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .msg { display: flex; gap: 10px; animation: msgIn 0.35s cubic-bezier(.16,1,.3,1) forwards; opacity: 0; }
        @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .msg.user { flex-direction: row-reverse; }
        .avatar {
            width: 31px; height: 31px; border-radius: 8px; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; font-weight: 700; font-size: 0.78rem;
        }
        .msg.bot .avatar { background: linear-gradient(135deg, var(--accent), #0891b2); color: var(--bg); }
        .msg.user .avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .bubble {
            max-width: 68%; padding: 11px 14px; border-radius: 14px; font-size: 0.87rem; line-height: 1.58;
        }
        .msg.bot .bubble { background: var(--elevated); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg.user .bubble { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-bottom-right-radius: 4px; color: white; font-weight: 500; }

        /* Markdown */
        .bubble p { margin: 0 0 8px 0; } .bubble p:last-child { margin-bottom: 0; }
        .bubble strong { font-weight: 600; }
        .bubble code { background: rgba(0,0,0,0.26); padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono',monospace; font-size: 0.8em; }
        .bubble pre { background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
        .bubble pre code { background: none; padding: 0; font-size: 0.78rem; line-height: 1.48; }
        .bubble ul, .bubble ol { margin: 6px 0; padding-left: 16px; } .bubble li { margin: 2px 0; }
        .bubble blockquote { border-left: 3px solid var(--accent); margin: 7px 0; padding: 6px 10px; background: rgba(6,182,212,0.05); border-radius: 0 6px 6px 0; color: var(--muted); }
        .bubble h1,.bubble h2,.bubble h3 { margin: 10px 0 5px; font-weight: 700; }
        .bubble h1{font-size:1.15rem} .bubble h2{font-size:1.03rem} .bubble h3{font-size:0.95rem}
        .bubble a { color: var(--accent); text-decoration: underline; }

        /* Typing */
        .typing-row { display: flex; gap: 10px; }
        .typing-bubble { display: flex; gap: 4px; padding: 12px 16px; background: var(--elevated); border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px; }
        .tdot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: tp 1.3s infinite ease-in-out; }
        .tdot:nth-child(2){animation-delay:.14s} .tdot:nth-child(3){animation-delay:.28s}
        @keyframes tp { 0%,80%,100%{transform:scale(0.45);opacity:.3} 40%{transform:scale(1);opacity:1} }

        /* Progress indicator during fetch */
        .progress-bar {
            width: 100%; max-width: 640px; margin: 0 auto 12px;
            background: var(--elevated); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 16px; display: none;
        }
        .progress-bar.visible { display: block; }
        .prog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.78rem; }
        .prog-header span:first-child { color: var(--warn); font-weight: 500; }
        .prog-header span:last-child { color: var(--muted); font-family: 'JetBrains Mono',monospace; font-size: 0.72rem; }
        .prog-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
        .prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #0891b2); border-radius: 2px; transition: width 0.3s ease; width: 0%; }
        .prog-url { font-size: 0.7rem; color: var(--muted); margin-top: 6px; word-break: break-all; font-family: 'JetBrains Mono',monospace; opacity: 0.7; }

        /* Input */
        .input-area { padding: 14px 20px 18px; background: linear-gradient(to top, var(--bg) 42%, transparent); }
        .input-box {
            max-width: 640px; margin: 0 auto; background: var(--card); border: 1px solid var(--border);
            border-radius: 13px; padding: 6px 6px 6px 15px; display: flex; align-items: flex-end; gap: 8px;
            transition: all 0.25s; backdrop-filter: blur(14px);
        }
        .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow), 0 7px 28px rgba(0,0,0,0.26); }
        .txt-input { flex: 1; background: transparent; border: none; outline: none; color: var(--fg); font-size: 0.87rem; font-family: 'Outfit',sans-serif; resize: none; min-height: 21px; max-height: 110px; line-height: 1.5; }
        .txt-input::placeholder { color: var(--muted); }
        .send-btn {
            width: 40px; height: 40px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #0891b2);
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { transform: scale(1.04); box-shadow: 0 5px 20px var(--glow); }
        .send-btn:disabled { opacity: 0.42; cursor: not-allowed; }
        .send-btn svg { width: 17px; height: 17px; color: var(--bg); stroke-width: 2.4; }
        .hint { text-align: center; margin-top: 9px; font-size: 0.69rem; color: var(--muted); }

        /* Error & Debug */
        .err-box {
            background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.18); color: var(--err);
            padding: 10px 13px; border-radius: 9px; font-size: 0.81rem; margin-bottom: 11px;
            display: flex; align-items: flex-start; gap: 7px; line-height: 1.45;
        }
        .dbg-box {
            background: rgba(245,158,11,0.05); border: 1px solid rgba(245,158,11,0.14); color: var(--warn);
            padding: 10px 13px; border-radius: 9px; font-size: 0.74rem; font-family: 'JetBrains Mono',monospace;
            margin-bottom: 11px; max-height: 160px; overflow-y: auto;
        }
        .dbg-box pre { white-space: pre-wrap; word-break: break-all; margin: 0; }

        /* Connection test result */
        .conn-result {
            background: var(--elevated); border: 1px solid var(--border); border-radius: 10px;
            padding: 14px 16px; margin: 12px 20px; max-width: 640px; margin-left: auto; margin-right: auto;
            display: none; font-size: 0.82rem;
        }
        .conn-result.visible { display: block; }
        .conn-result.ok { border-color: rgba(16,185,129,0.3); }
        .conn-result.fail { border-color: rgba(239,68,68,0.3); }
        .conn-title { font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .conn-detail { color: var(--muted); font-size: 0.76rem; line-height: 1.5; }

        /* Mobile mask */
        .mask { display: none; position: fixed; inset: 0; background: rgba(3,7,18,0.82); backdrop-filter: blur(4px); z-index: 55; opacity: 0; transition: opacity 0.26s; }
        .mask.show { display: block; opacity: 1; }

        @media(max-width:900px){
            .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);box-shadow:14px 0 46px rgba(0,0,0,0.5)}
            .side.open{transform:translateX(0)}
            .menu-btn{display:flex}
            .msgs{padding:14px}
            .input-area{padding:12px 16px 16px}
            .hdr{padding:0 14px}
        }
        @media(max-width:520px){
            .grid-feat{grid-template-columns:1fr}
            .bubble{max-width:78%}
            .welcome h2{font-size:1.5rem}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
        *:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        .spinner{width:17px;height:17px;border:2.2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="mask" id="mask" onclick="closeSide()"></div>

<!-- Connection Test Result -->
<div class="conn-result" id="connResult">
    <div class="conn-title" id="connTitle">Menguji Koneksi...</div>
    <div class="conn-detail" id="connDetail"></div>
</div>

<div class="app">
<aside class="side" id="side">
    <div class="side-head">
        <div class="brand">
            <div class="brand-icon">H</div>
            <div><h1>Hisam AI</h1><span>Doubao Neural</span></div>
        </div>
        <button class="btn-new" onclick="newChat()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Chat Baru
        </button>
    </div>
    <div class="side-body">
        <p class="sec-lbl">Riwayat</p>
        <div id="histBox"><p style="padding:14px;text-align:center;color:var(--muted);font-size:0.78rem;">Kosong</p></div>
    </div>
    <div class="side-foot">
        <button onclick="toggleDbg()" style="width:100%;padding:7px;background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.14);border-radius:7px;color:var(--warn);font-size:0.75rem;cursor:pointer;font-family:inherit">
            Debug: <strong id="dbgLbl">OFF</strong>
        </button>
        <button onclick="testConnection()" style="width:100%;margin-top:6px;padding:7px;background:rgba(6,182,212,0.07);border:1px solid rgba(6,182,212,0.14);border-radius:7px;color:var(--accent);font-size:0.75rem;cursor:pointer;font-family:inherit;margin-top:6px">
            Test Koneksi API
        </button>
    </div>
</aside>

<main class="main">
<header class="hdr">
    <div style="display:flex;align-items:center;gap:11px">
        <button class="menu-btn" onclick="openSide()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
    </div>
    <div class="status-pill"><span class="status-dot"></span>Aktif</div>
</header>

<div class="chat">
    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar">
        <div class="prog-header">
            <span>Menghubungi Server...</span>
            <span id="progTimer">0s</span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
        <div class="prog-url" id="progUrl"></div>
    </div>

    <div class="msgs" id="scrollArea">
        <div class="welcome" id="welcomeView">
            <div class="welcome-badge">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                Doubao Neural Network
            </div>
            <h2>Apa yang bisa saya bantu?</h2>
            <p>Asisten neural cerdas siap membantu menjawab pertanyaan dan menulis kode.</p>
            <div class="grid-feat">
                <button class="feat" onclick="setPrompt('Jelaskan quantum computing sederhana')">
                    <div class="feat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
                    <div class="feat-title">Eksplorasi Ilmu</div>
                    <div class="feat-desc">Pelajari konsep kompleks</div>
                </button>
                <button class="feat" onclick="setPrompt('Buat kode JavaScript async await')">
                    <div class="feat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
                    <div class="feat-title">Generasi Kode</div>
                    <div class="feat-desc">Tulis & debug code</div>
                </button>
                <button class="feat" onclick="setPrompt('Tulis email profesional Bahasa Indonesia')">
                    <div class="feat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                    <div class="feat-title">Penulisan Konten</div>
                    <div class="feat-desc">Dokumen & artikel</div>
                </button>
                <button class="feat" onclick="setPrompt('Analisis tren AI 2024')">
                    <div class="feat-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
                    <div class="feat-title">Analisis Data</div>
                    <div class="feat-desc">Insight & statistik</div>
                </button>
            </div>
        </div>
        <div class="msg-list" id="msgList" style="display:none"></div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <textarea id="inp" class="txt-input" placeholder="Ketik pesan..." rows="1" onkeydown="onKey(event)" oninput="grow(this)"></textarea>
            <button class="send-btn" id="sndBtn" onclick="sendMsg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        </div>
        <p class="hint">Enter kirim | Shift+Enter baris baru</p>
    </div>
</div>
</main>
</div>

<script>
// =====================================================
// CONFIGURATION - DENGAN BANYAK FORMAT URL ALTERNATIF
// =====================================================

// Format URL yang mungkin valid untuk Volcengine Ark API
const URL_FORMATS = [
    // Format 1: Standard OpenAI-compatible
    { base: 'https://ark.cn-beijing.volces.com/api/v3', path: '/chat/completions' },
    { base: 'https://ark.ap-southeast-1.volces.com/api/v3', path: '/chat/completions' },
    
    // Format 2: Tanpa /api prefix
    { base: 'https://ark.cn-beijing.volces.com/v3', path: '/chat/completions' },
    
    // Format 3: OpenAI compatible (jika ada)
    { base: 'https://open.bigmodel.cn/api/paas/v4', path: '/chat/completions' },
    
    // Format 4: Direct endpoint
    { base: 'https://ark.cn-beijing.volces.com/api/v3/chat/completions', path: '' },
];

const CONFIG = {
    apiKey: '7266a86eaf81474fb8fa8cd41df77040.X69Ft6uPQ29STOiy',
    endpointId: 'ep-20241226154107-lmzqv',
    timeoutMs: 25000,  // Reduced to detect faster
};

// State
const st = {
    msgs: [],
    hist: [],
    busy: false,
    dbg: false,
    workingUrl: null  // Cache working URL
};

// DOM
const el = {};

function initDOM() {
    el.side = document.getElementById('side');
    el.mask = document.getElementById('mask');
    el.welcome = document.getElementById('welcomeView');
    el.list = document.getElementById('msgList');
    el.inp = document.getElementById('inp');
    el.btn = document.getElementById('sndBtn');
    el.histBox = document.getElementById('histBox');
    el.scroll = document.getElementById('scrollArea');
    el.dbgLbl = document.getElementById('dbgLbl');
    el.progBar = document.getElementById('progressBar');
    el.progFill = document.getElementById('progFill');
    el.progTimer = document.getElementById('progTimer');
    el.progUrl = document.getElementById('progUrl');
    el.connResult = document.getElementById('connResult');
    el.connTitle = document.getElementById('connTitle');
    el.connDetail = document.getElementById('connDetail');
}

document.addEventListener('DOMContentLoaded', () => {
    initDOM();
    loadState();
    if (el.inp) el.inp.focus();
});

function toggleDbg() {
    st.dbg = !st.dbg;
    if (el.dbgLbl) {
        el.dbgLbl.textContent = st.dbg ? 'ON' : 'OFF';
        el.dbgLbl.style.color = st.dbg ? '#10b981' : '#f59e0b';
    }
}

function log(...a) { if (st.dbg) console.log('[Hisam]', ...a); }

function save() {
    try {
        localStorage.setItem('hisam_v5_msgs', JSON.stringify(st.msgs));
        localStorage.setItem('hisam_v5_hist', JSON.stringify(st.hist));
    } catch(e) { log('Save err:', e); }
}

function load() {
    try {
        const m = localStorage.getItem('hisam_v5_msgs');
        const h = localStorage.getItem('hisam_v5_hist');
        if (m) {
            st.msgs = JSON.parse(m).map(x => ({ ...x, role: x.role === 'ai' ? 'assistant' : x.role }));
            if (st.msgs.length > 0) { hideWelcome(); renderAll(); }
        }
        if (h) { st.hist = JSON.parse(h); renderHist(); }
    } catch(e) { log('Load err:', e); }
}

// Sidebar
function openSide() { if(el.side)el.side.classList.add('open'); if(el.mask)el.mask.classList.add('show'); }
function closeSide() { if(el.side)el.side.classList.remove('open'); if(el.mask)el.mask.classList.remove('show'); }

function newChat() {
    if (st.msgs.length > 0) {
        const first = st.msgs.find(m => m.role === 'user');
        if (first) {
            st.hist.unshift({ id: Date.now(), title: first.content.slice(0, 35) + (first.content.length > 35 ? '...' : ''), ts: new Date().toISOString() });
            st.hist = st.hist.slice(0, 12);
            renderHist();
        }
    }
    st.msgs = []; save(); showWelcome();
    if (el.list) el.list.innerHTML = '';
    closeSide();
}

function setPrompt(t) { if (el.inp) { el.inp.value = t; sendMsg(); } }
function hideWelcome() { if (el.welcome) el.welcome.style.display = 'none'; if (el.list) el.list.style.display = 'flex'; }
function showWelcome() { if (el.welcome) el.welcome.style.display = 'block'; if (el.list) el.list.style.display = 'none'; }

// Render
function renderAll() {
    if (!el.list) return;
    el.list.innerHTML = '';
    st.msgs.forEach((m, i) => addMsg(m.role, m.content, i * 44));
    scrollEnd();
}

function addMsg(role, txt, delay = 0) {
    if (!el.list) return;
    const n = document.createElement('div');
    n.className = `msg ${role === 'assistant' ? 'bot' : 'user'}`;
    n.style.animationDelay = delay + 'ms';
    n.innerHTML = `<div class="avatar">${role === 'assistant' ? 'H' : 'U'}</div><div class="bubble">${md(txt)}</div>`;
    el.list.appendChild(n);
    scrollEnd();
}

// Markdown parser
function md(t) {
    if (!t) return '';
    let h = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
    h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    h = h.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    h = h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
    h = h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
    h = h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
    h = h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
    h = h.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
    h = h.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
    h = h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    h = h.replace(/\n\n/g,'</p><p>'); h = h.replace(/\n/g,'<br>');
    if (!h.startsWith('<')) h = '<p>' + h + '</p>';
    return h;
}

function showTyping() {
    if (!el.list) return null;
    const r = document.createElement('div'); r.className = 'typing-row'; r.id = 'typ';
    r.innerHTML = `<div class="avatar">H</div><div class="typing-bubble"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>`;
    el.list.appendChild(r); scrollEnd(); return r;
}
function hideTyping() { const t = document.getElementById('typ'); if (t) t.remove(); }

function showErr(msg) {
    if (!el.list) return;
    const d = document.createElement('div'); d.className = 'err-box';
    d.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>${escHtml(msg)}</span>`;
    el.list.appendChild(d); scrollEnd();
}

function showDbg(data) {
    if (!st.dbg || !el.list) return;
    const d = document.createElement('div'); d.className = 'dbg-box';
    d.innerHTML = `<pre>${escHtml(JSON.stringify(data, null, 2))}</pre>`;
    el.list.appendChild(d); scrollEnd();
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scrollEnd() { setTimeout(() => { if (el.scroll) el.scroll.scrollTo({ top: el.scroll.scrollHeight, behavior: 'smooth' }); }, 25); }

// History
function renderHist() {
    if (!el.histBox) return;
    if (st.hist.length === 0) { el.histBox.innerHTML = '<p style="padding:14px;text-align:center;color:var(--muted);font-size:0.78rem;">Kosong</p>'; return; }
    el.histBox.innerHTML = st.hist.map(h => `
        <div class="hist-item" onclick="loadHist(${h.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(h.title)}</span>
        </div>
    `).join('');
}
function loadHist(id) { const item = st.hist.find(h => h.id === id); if (item && el.inp) { el.inp.value = item.title; closeSide(); } }

// Input
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }
function grow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 110) + 'px'; }
function setLoading(v) {
    if (!el.btn) return;
    el.btn.disabled = v;
    el.btn.innerHTML = v ? '<div class="spinner"></div>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
}

// Progress bar control
let progInterval = null;
let progSeconds = 0;

function startProgress(url) {
    progSeconds = 0;
    if (el.progBar) el.progBar.classList.add('visible');
    if (el.progFill) el.progFill.style.width = '0%';
    if (el.progUrl) el.progUrl.textContent = url || '';
    if (el.progTimer) el.progTimer.textContent = '0s';
    
    progInterval = setInterval(() => {
        progSeconds++;
        if (el.progTimer) el.progTimer.textContent = progSeconds + 's';
        // Max progress at 90% (leave room for actual completion)
        const pct = Math.min(90, (progSeconds / (CONFIG.timeoutMs / 1000)) * 90);
        if (el.progFill) el.progFill.style.width = pct + '%';
    }, 1000);
}

function stopProgress(success) {
    clearInterval(progInterval);
    progInterval = null;
    if (el.progFill) el.progFill.style.width = success ? '100%' : '0%';
    setTimeout(() => {
        if (el.progBar) el.progBar.classList.remove('visible');
    }, success ? 800 : 200);
}

// =====================================================
// CONNECTION TEST FUNCTION
// =====================================================
async function testConnection() {
    if (!el.connResult) return;
    
    el.connResult.className = 'conn-result visible';
    el.connTitle.innerHTML = '<span class="spinner" style="display:inline-block;width:14px;height:14px;border-width:2px"></span> Menguji koneksi...';
    el.connDetail.textContent = 'Mencoba semua format URL...';
    
    const results = [];
    
    for (let i = 0; i < URL_FORMATS.length; i++) {
        const fmt = URL_FORMATS[i];
        const fullUrl = fmt.base + fmt.path;
        
        el.connDetail.textContent = `Mencoba ${i + 1}/${URL_FORMATS.length}: ${fullUrl.slice(0, 50)}...`;
        
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 10000); // 10 second test
            
            const resp = await fetch(fullUrl, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.apiKey}`
                },
                body: JSON.stringify({
                    model: CONFIG.endpointId,
                    messages: [{ role: 'user', content: 'hi' }],
                    max_tokens: 5
                }),
                signal: ctrl.signal
            });
            
            clearTimeout(timer);
            
            results.push({
                url: fullUrl,
                status: resp.status,
                ok: resp.ok,
                note: resp.ok ? 'BERHASIL!' : `HTTP ${resp.status}`
            });
            
            if (resp.ok) {
                // Found working URL!
                st.workingUrl = fullUrl;
                const data = await resp.json();
                results[results.length - 1].response = data;
                
                el.connResult.className = 'conn-result visible ok';
                el.connTitle.innerHTML = '<span style="color:var(--ok)">Koneksi Berhasil!</span>';
                el.connDetail.innerHTML `
                    <strong>URL yang berfungsi:</strong><br>
                    <code style="background:rgba(0,0,0,0.3);padding:2px 5px;border-radius:3px;font-size:0.72rem">${fullUrl}</code><br><br>
                    <strong>Status:</strong> ${resp.status}<br>
                    <strong>Response:</strong> ${JSON.stringify(data).slice(0, 200)}
                `;
                return;
            }
            
        } catch(err) {
            results.push({
                url: fullUrl,
                status: 'ERROR',
                ok: false,
                note: err.name === 'AbortError' ? 'Timeout' : err.message.slice(0, 80)
            });
        }
    }
    
    // All failed
    el.connResult.className = 'conn-result visible fail';
    el.connTitle.innerHTML = '<span style="color:var(--err)">Semua URL Gagal</span>';
    
    let detailHTML = '<strong>Hasil test:</strong><br>';
    results.forEach((r, i) => {
        detailHTML += `<br><strong>${i + 1}.</strong> ${r.url.slice(0, 50)}...<br>`;
        detailHTML += `   Status: ${r.note}<br>`;
    });
    
    detailHTML += `
        <br><strong>Kemungkinan masalah:</strong><br>
        1. API Key expired atau salah<br>
        2. Endpoint ID tidak aktif<br>
        3. Perlu jalankan via local server (CORS)<br>
        4. Jaringan memblokir domain volces.com<br>
        <br><strong>Solusi cepat:</strong><br>
        Jalankan: <code style="background:rgba(0,0,0,0.3);padding:2px 5px;border-radius:3px">npx serve .</code>
    `;
    
    el.connDetail.innerHTML = detailHTML;
}

// =====================================================
// MAIN SEND FUNCTION
// =====================================================
async function sendMsg() {
    if (!el.inp || st.busy) return;
    const txt = el.inp.value.trim();
    if (!txt) return;

    hideWelcome();
    addMsg('user', txt);
    st.msgs.push({ role: 'user', content: txt });

    el.inp.value = ''; el.inp.style.height = 'auto';

    st.busy = true; setLoading(true);

    const typingEl = showTyping();

    // Determine URLs to try
    const urlsToTry = st.workingUrl 
        ? [{ base: st.workingUrl.replace(/\/chat\/completions$/, ''), path: '/chat/completions' }]
        : URL_FORMATS;

    let ok = false;
    let lastErr = null;

    for (let i = 0; i < urlsToTry.length && !ok; i++) {
        const fmt = urlsToTry[i];
        const fullUrl = fmt.base + fmt.path;
        
        log(`Trying [${i + 1}/${urlsToTry.length}]:`, fullUrl);
        
        // Start progress bar
        startProgress(fullUrl);

        try {
            const result = await callAPI(fullUrl, txt);
            
            if (result.success) {
                ok = true;
                
                // Cache working URL
                if (!st.workingUrl) {
                    st.workingUrl = fullUrl;
                    log('Cached working URL:', fullUrl);
                }
                
                hideTyping();
                addMsg('assistant', result.text);
                st.msgs.push({ role: 'assistant', content: result.text });
                save();
                stopProgress(true);
            }
        } catch(err) {
            lastErr = err;
            log(`Failed:`, err.message);
            stopProgress(false);
            
            // Don't retry auth errors
            if (err.message.includes('401') || err.message.includes('Unauthorized')) break;
        }
    }

    hideTyping();

    if (!ok) {
        let errMsg = lastErr ? lastErr.message : 'Gagal terhubung';
        
        // Better error messages
        if (errMsg.includes('Timeout')) {
            errMsg = `Timeout! Server tidak merespons dalam ${CONFIG.timeoutMs/1000} detik.\n\nKemungkinan:\n- URL endpoint salah\n- Server sedang down\n- API key invalid`;
        } else if (errMsg.includes('Failed to fetch') || errMsg.includes('CORS')) {
            errMsg = `CORS/Network Error!\n\nSolusi: Jalankan file ini via local server:\n• npx serve .\n• python -m http.server 8080\n• VS Code Live Server`;
        }
        
        showErr(errMsg);
        
        if (st.dbg) {
            showDbg({
                error: lastErr?.message,
                urlsTried: urlsToTry.length,
                cachedUrl: st.workingUrl || 'none',
                model: CONFIG.endpointId,
                keyPreview: CONFIG.apiKey.substring(0, 14) + '...',
                hint: 'Click "Test Koneksi API" di sidebar untuk diagnose'
            });
        }
    }

    st.busy = false; setLoading(false);
}

// =====================================================
// CORE API CALL
// =====================================================
async function callAPI(fullUrl, userInput) {
    log('Calling:', fullUrl);

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.timeoutMs);

    try {
        const payload = {
            model: CONFIG.endpointId,
            messages: [
                { role: 'system', content: 'Kamu adalah Hisam AI, asisten cerdas berbasis Doubao. Jawab dalam Bahasa Indonesia. Gunakan markdown.' },
                ...st.msgs.map(m => ({ role: m.role, content: m.content }))
            ],
            temperature: 0.7,
            max_tokens: 2000
        };

        log('Payload:', { model: payload.model, msgs: payload.messages.length });

        const resp = await fetch(fullUrl, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${CONFIG.apiKey}`
            },
            body: JSON.stringify(payload),
            signal: ctrl.signal
        });

        clearTimeout(timer);
        log('Response:', resp.status, resp.statusText);

        if (!resp.ok) {
            let body = '';
            try { body = await resp.text(); } catch(e) {}
            throw new Error(`HTTP ${resp.status}: ${resp.statusText}${body ? '\n' + body.slice(0, 300) : ''}`);
        }

        const data = await resp.json();
        log('Data:', data);

        if (!data.choices || !data.choices[0] || !data.choices[0].message) {
            throw new Error('Invalid response structure');
        }

        return { success: true, text: data.choices[0].message.content.trim() };

    } catch(err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') throw new Error('Timeout');
        if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
            throw new Error('CORS_ERROR: ' + err.message);
        }
        throw err;
    }
}
